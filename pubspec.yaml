name: uas_moprog
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  provider: ^6.1.5
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/lingualearn_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E8F8E5"
  adaptive_icon_foreground: "assets/images/lingualearn_logo.png"
